  var lang = "id", cur = 1, file = null, objUrl = null;
  var s = { clicked: false, donated: false, proof: false };

  try { var sv = localStorage.getItem("xos-lang"); if (sv === "en" || sv === "id") lang = sv; } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function t(k, v) {
    var str = (T[lang] && T[lang][k]) || k;
    if (v) for (var x in v) str = str.replace("{" + x + "}", v[x]);
    return str;
  }

  function applyLang() {
    document.documentElement.lang = lang;
    var els = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute("data-i18n"));
    var sw = $("lang");
    sw.setAttribute("aria-checked", lang === "en" ? "true" : "false");
    sw.setAttribute("aria-label", t("langLabel"));
  }

  function render() {
    var tabs = document.querySelectorAll(".tab");
    for (var i = 0; i < tabs.length; i++) {
      var n = +tabs[i].getAttribute("data-tab"), st;
      if (n === 1) st = s.donated ? "done" : "open";
      else if (n === 2) st = s.proof ? "done" : (s.donated ? "open" : "locked");
      else st = s.proof ? "open" : "locked";
      tabs[i].setAttribute("data-state", st);
      if (n === cur) tabs[i].setAttribute("aria-current", "page"); else tabs[i].removeAttribute("aria-current");
    }
    for (var p = 1; p <= 3; p++) $("p" + p).hidden = p !== cur;
    $("confirm").hidden = !(s.clicked && !s.donated);
    $("lock2").hidden = s.donated;
    $("form2").hidden = !s.donated;
    $("lock3").hidden = s.proof;
    $("ready3").hidden = !s.proof;
    $("send").setAttribute("aria-disabled", file ? "false" : "true");
    $("share").setAttribute("aria-disabled", file ? "false" : "true");
    $("preview").hidden = !file;
    $("drop").hidden = !!file;
  }

  function go(n) {
    cur = n;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function setFile(f) {
    var err = $("err");
    err.textContent = "";
    if (!f) return;
    if (!/^image\//.test(f.type)) { err.textContent = t("wrongType"); return; }
    file = f;
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(f);
    $("thumb").src = objUrl;
    $("fname").textContent = f.name;
    render();
  }

  // events
  $("lang").addEventListener("click", function () {
    lang = lang === "id" ? "en" : "id";
    try { localStorage.setItem("xos-lang", lang); } catch (e) {}
    applyLang();
    if (!file) $("err").textContent = "";
  });

  var tabBtns = document.querySelectorAll(".tab");
  for (var i = 0; i < tabBtns.length; i++) tabBtns[i].addEventListener("click", function () { go(+this.getAttribute("data-tab")); });
  var goBtns = document.querySelectorAll("[data-go]");
  for (var j = 0; j < goBtns.length; j++) goBtns[j].addEventListener("click", function () { go(+this.getAttribute("data-go")); });

  $("donate").addEventListener("click", function () {
    setTimeout(function () {
      s.clicked = true; render();
      var c = $("confirm"); c.classList.remove("pulse"); void c.offsetWidth; c.classList.add("pulse");
      c.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 600);
  });
  $("confirmBtn").addEventListener("click", function () { s.donated = true; go(2); });

  $("shot").addEventListener("change", function () { setFile(this.files && this.files[0]); });
  $("change").addEventListener("click", function () {
    file = null; $("shot").value = ""; render(); $("shot").click();
  });

  $("share").addEventListener("click", function () {
    var err = $("err");
    err.textContent = "";
    if (!file) { err.textContent = t("needFile"); return; }
    var ok = false;
    try { ok = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) {}
    if (!ok) { err.textContent = t("shareFail"); return; }
    navigator.share({ files: [file], title: "Bukti donasi Xos17 Mod Launcher Premium", text: "Bukti donasi Xos17 Mod Launcher Premium" })
      .then(function () { s.proof = true; go(3); })
      .catch(function (e) {
        if (e && e.name === "AbortError") return;
        err.textContent = t("shareFail");
      });
  });

  $("send").addEventListener("click", function (e) {
    if (!file) { e.preventDefault(); $("err").textContent = t("needFile"); return; }
    setTimeout(function () { s.proof = true; go(3); }, 700);
  });

  $("reset").addEventListener("click", function () {
    s = { clicked: false, donated: false, proof: false };
    file = null; $("shot").value = ""; $("err").textContent = "";
    go(1);
  });

  applyLang();
  render();
})();
